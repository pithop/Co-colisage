<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" fill="none">
  <defs>
    <linearGradient id="luggageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="40" cy="96" rx="28" ry="4" fill="#0F172A" fill-opacity="0.18" />
  <!-- Telescopic Handle -->
  <rect x="30" y="4" width="20" height="18" rx="3" stroke="#64748B" stroke-width="3" fill="none" />
  <line x1="34" y1="18" x2="34" y2="26" stroke="#94A3B8" stroke-width="3" />
  <line x1="46" y1="18" x2="46" y2="26" stroke="#94A3B8" stroke-width="3" />
  <!-- Main Suitcase Shell -->
  <rect x="14" y="24" width="52" height="66" rx="8" fill="url(#luggageGrad)" stroke="#475569" stroke-width="1.5" />
  <!-- Grooves / Ridges (Rimowa style) -->
  <line x1="22" y1="36" x2="58" y2="36" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="46" x2="58" y2="46" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="56" x2="58" y2="56" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="66" x2="58" y2="66" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="76" x2="58" y2="76" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <!-- Top and Side Handle -->
  <rect x="32" y="22" width="16" height="4" rx="2" fill="#64748B" />
  <!-- Wheels -->
  <circle cx="24" cy="91" r="3.5" fill="#0F172A" stroke="#64748B" stroke-width="1" />
  <circle cx="56" cy="91" r="3.5" fill="#0F172A" stroke="#64748B" stroke-width="1" />
</svg>